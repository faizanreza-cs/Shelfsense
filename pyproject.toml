[project]
name = "shelfsense"
version = "0.1.0"
description = "Consumer insights and product recommendations for a health and nutrition store: a recommender with a learned re-ranker, review aspect sentiment trained on LLM labels, drift monitoring and an insights agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Reza", email = "faizanreza01@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "openai>=1.40"]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "matplotlib>=3.8"]

[project.scripts]
shelfsense = "shelfsense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
# the dataiku/ folder holds recipes, not the dataiku package
known-third-party = ["dataiku"]

[tool.ruff.lint.per-file-ignores]
# tool descriptions are prose the model reads; review templates are prose too
"shelfsense/agent/tools.py" = ["E501"]
"shelfsense/synth.py" = ["E501"]
"shelfsense/agent/provider.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["shelfsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
